# moonregf 的 CI 只回答三个问题：字节布局还对不对、两个后端读得一样吗、写出的 hive 自己能不能读回。
# 三个作业互相独立，红了能一眼看出是哪一层。
name: regf

on:
  push:
    branches: [master]
  pull_request:

jobs:
  layout:
    name: 字节布局（格式 / 类型 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: 拉取注册表索引
        run: moon update
      - name: 记录工具链版本
        run: moon version --all
      - name: 格式与类型（警告即失败）
        run: |
          moon fmt --check
          moon check --target wasm-gc --deny-warn
      - name: 构建
        run: moon build --target wasm-gc

  parser:
    name: 解析器测试（${{ matrix.backend }}）
    needs: layout
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: 拉取注册表索引
        run: moon update
      - name: 跑测试（警告即失败）
        run: moon test --target "${{ matrix.backend }}" --deny-warn

  roundtrip:
    name: 写出的 hive 必须能被读回
    needs: layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: 拉取注册表索引
        run: moon update
      - name: 写入器 → 解析器（键数 / 值数 / 校验和）
        run: |
          set -euo pipefail
          moon run cmd/main -- --build "$RUNNER_TEMP/demo.hive"
          moon run cmd/main -- "$RUNNER_TEMP/demo.hive" | tee "$RUNNER_TEMP/tree.txt"
          grep -q "tree keys  : 3" "$RUNNER_TEMP/tree.txt"
          grep -q "checksum   : 0x" "$RUNNER_TEMP/tree.txt"
          moon run cmd/main -- "$RUNNER_TEMP/demo.hive" --values | tee "$RUNNER_TEMP/values.txt"
          grep -q "values     : 3" "$RUNNER_TEMP/values.txt"
      - name: .reg 夹具 → hive → .reg
        run: |
          set -euo pipefail
          moon run cmd/main -- --import-reg examples/sample.reg "$RUNNER_TEMP/from_reg.hive" | tee "$RUNNER_TEMP/import.txt"
          grep -q "imported 2 sections and 4 values" "$RUNNER_TEMP/import.txt"
          moon run cmd/main -- --export-reg "$RUNNER_TEMP/from_reg.hive" "$RUNNER_TEMP/back.reg" HKEY_CURRENT_USER
          grep -q "Windows Registry Editor Version 5.00" "$RUNNER_TEMP/back.reg"
          grep -q "dword:0000002a" "$RUNNER_TEMP/back.reg"
          grep -q "hex(2):25,00,54,00,45,00,4d,00,50,00,25,00,00,00" "$RUNNER_TEMP/back.reg"
          grep -q "Nested" "$RUNNER_TEMP/back.reg"
