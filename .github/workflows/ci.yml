name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: moon version --all
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --target wasm-gc --deny-warn
      - name: Build
        run: moon build --target wasm-gc
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc
      - name: Test (js)
        run: moon test --target js
      - name: Run example
        run: moon run examples/basic
